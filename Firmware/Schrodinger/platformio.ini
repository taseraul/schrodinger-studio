; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@^6.11.0
; board = esp32dev esp32cam
board = esp32cam
framework = arduino
lib_deps = 
	esp32async/ESPAsyncWebServer@^3.7.7
	mikaeltulldahl/AsyncOta@^1.0.2
	arduino-libraries/Arduino_JSON@^0.2.0
	kosme/arduinoFFT@^2.0.4
	esp32async/AsyncTCP@^3.4.4
	https://github.com/pschatzmann/ESP32-A2DP@^1.8.7
	https://github.com/pschatzmann/arduino-audio-tools@^1.1.1

lib_ignore = 
	lwIP_ESPHost
build_flags = 
  	-D CORE_DEBUG_LEVEL=0
	-D BOARD_HAS_PSRAM
	-D CONFIG_SPIRAM_USE_MALLOC=1
	-D CONFIG_SPIRAM_USE_CAPS_ALLOC=1
	-D CONFIG_SPIRAM_USE_MEMMAP=1
	-D CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=0
	-D CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=32768
	-D CONFIG_ASYNC_TCP_USE_WDT=0
	-D CONFIG_ASYNC_TCP_STACK_SIZE=4096
	-O2
build_unflags = -Os
monitor_speed = 115200
; board_build.partitions = default_8MB.csv
flash_size = 16MB
